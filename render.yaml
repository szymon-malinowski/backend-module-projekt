services:
  - type: web
    name: backend-module-api
    runtime: node
    branch: main
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backend-module-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: backend-module-db
    databaseName: backend_module
    user: backend_module
